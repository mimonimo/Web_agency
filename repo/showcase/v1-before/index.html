<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>밀밭제과 예약 주문</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <h1>밀밭제과 예약 주문</h1>
    <form id="orderForm">
        <label for="product">상품 선택:</label>
        <select id="product" name="product" required>
            <option value="milbam_cake">밀밈 케이크</option>
            <option value="milbam_cookie">밀밈 쿠키</option>
            <option value="milbam_bread">밀밈 빵</option>
        </select>
        <br />
        <label for="quantity">수량:</label>
        <input type="number" id="quantity" name="quantity" min="1" value="1" required />
        <br />
        <label for="date">예약 일자:</label>
        <input type="date" id="date" name="date" required />
        <br />
        <label for="name">주문자 이름:</label>
        <input type="text" id="name" name="name" required />
        <br />
        <button type="submit">예약하기</button>
    </form>
    <pre id="result"></pre>

    <script src="app.js"></script>
</body>
</html>
