<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGORA Web — 픽셀 오피스</title>
<link rel="stylesheet" href="/assets/office.css">
</head>
<body>
<!--
  픽셀 오피스 — PM 관제 화면 (BRIEF §8)
  빌드 없음. 프레임워크 없음. CDN 없음. 도트는 CSS 로 직접 그린다.
  /api/dashboard 를 2초마다 폴링한다 (인수 #26: 5초 내 반영).

  ★ 이 화면의 하이라이트는 '되감기 화살표' 다.
    QA 가 반려하면 S6 → S5 로 화살표가 거꾸로 그려지고 그 구간이 빨갛게 물든다.
-->

<header class="bar">
  <div class="brand">AGORA<span>Web</span></div>

  <div class="controls">
    <button id="btn-pause"  title="현재 단계를 끝까지 마친 뒤 정지">⏸ 일시정지</button>
    <button id="btn-resume" title="다음 단계부터 재개">▶ 재개</button>
    <button id="btn-step"   title="한 단계만 실행하고 다시 정지">⏭ 한 단계</button>
    <button id="btn-rewind" title="지정한 단계로 되감기">⏮ 되감기</button>
    <button id="btn-reset" class="danger" title="사이클을 처음부터">⟲ 처음부터</button>
  </div>

  <div class="cycleinfo">
    <span id="c-title">사이클 없음</span>
    <span id="c-status" class="badge">-</span>
  </div>
</header>

<main class="floor">
  <section class="zone counter">
    <h2>접수 카운터</h2>
    <div id="orders" class="orders"></div>
    <a class="link" href="/order.html">주문 접수 사이트 →</a><br>
    <a class="link" href="/edit.html">AGENT.md 편집 →</a>
  </section>

  <section class="zone desks">
    <h2>사무실 <span id="spec-counter" class="spec-counter" hidden></span></h2>
    <div id="desks" class="desk-grid"></div>
  </section>

  <section class="zone rooms">
    <h2>회의실 · 서버실</h2>
    <div class="room-grid">
      <div class="room" id="room-S6"><span class="lamp"></span>QA실</div>
      <div class="room" id="room-S7"><span class="lamp"></span>보안실</div>
      <div class="room" id="room-S8"><span class="lamp"></span>검수실</div>
      <div class="room server" id="room-S9"><span class="lamp"></span>서버실</div>
    </div>
    <div class="tickets" id="tickets"></div>
  </section>

  <section class="zone msgs">
    <h2>A2A 메시지</h2>
    <ul id="messages" class="msglist"></ul>
  </section>
</main>

<footer class="timeline-wrap">
  <div id="timeline" class="timeline"></div>
</footer>

<!-- ⟲ 처음부터 — 문구는 BRIEF §8.3 을 그대로 따른다 -->
<dialog id="dlg-reset">
  <form method="dialog">
    <p class="dlg-title">사이클을 처음부터 다시 시작합니다.</p>
    <label class="opt">
      <input type="radio" name="keep" value="true" checked>
      <span><b>AGENT.md 는 그대로 두기</b>
        <em>학생들이 고친 지시문을 유지한 채 같은 주문을 다시 돌립니다.</em></span>
    </label>
    <label class="opt">
      <input type="radio" name="keep" value="false">
      <span><b>AGENT.md 도 초안으로 되돌리기</b>
        <em>학생들의 수정 내용이 모두 사라집니다.</em></span>
    </label>
    <menu><button value="cancel">취소</button>
          <button value="ok" class="primary">실행</button></menu>
  </form>
</dialog>

<dialog id="dlg-rewind">
  <form method="dialog">
    <p class="dlg-title">어느 단계로 되감을까요?</p>
    <p class="dlg-sub">그 단계 이후의 모든 산출물이 무효화됩니다.</p>
    <div id="rewind-opts" class="rewind-opts"></div>
    <menu><button value="cancel">취소</button>
          <button value="ok" class="primary">되감기</button></menu>
  </form>
</dialog>

<script src="/assets/office.js"></script>
</body>
</html>
