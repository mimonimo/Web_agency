<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGENT.md 편집 — AGORA Web</title>
<link rel="stylesheet" href="/assets/office.css">
<style>
  .wrap{flex:1;display:grid;grid-template-columns:minmax(13rem,16rem) 1fr;
        gap:1rem;padding:1rem;min-height:0}
  @media (max-width:960px){ .wrap{grid-template-columns:1fr} }

  .roles{display:flex;flex-direction:column;gap:.35rem;overflow-y:auto}
  .roles button{display:flex;align-items:center;gap:.5rem;text-align:left;
    background:var(--panel);border:1.5px solid var(--line);border-radius:10px;
    padding:.55rem .75rem;cursor:pointer;color:var(--fg);font:inherit}
  .roles button:hover{background:var(--panel2)}
  .roles button.on{background:#1b2740;border-color:#33507f}
  .roles .st{margin-left:auto;font-size:.8rem;font-weight:800;border-radius:999px;
    padding:.05rem .55rem;background:var(--idle);color:#0d1017}
  .roles .st.customized{background:var(--ok)}

  .pane{display:flex;flex-direction:column;gap:.8rem;min-height:0}
  .paths{display:grid;grid-template-columns:auto 1fr;gap:.35rem .7rem;
         font-size:.93rem;align-items:center}
  .paths b{color:var(--dim);font-weight:650;white-space:nowrap}
  .paths .row{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
  .editor{flex:1;display:flex;flex-direction:column;min-height:0}
  textarea{flex:1;min-height:22rem}
  pre.view{flex:1;min-height:22rem;overflow:auto;margin:0;white-space:pre-wrap;
    background:#0f131b;border:1.5px solid var(--line);border-radius:9px;
    padding:.8rem;font-family:ui-monospace,"D2Coding",monospace;font-size:.95rem;line-height:1.65}
  pre.view .add{color:#86efac} pre.view .del{color:#fca5a5} pre.view .hd{color:#93c5fd}
  .bar2{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
  .prog{margin-left:auto;color:var(--dim);font-size:.95rem}
</style>
</head>
<body>
<div class="wrap">
  <aside class="roles" id="roles"></aside>

  <section class="pane">
    <div class="card">
      <h3><span id="title">역할을 고르세요</span>
        <span class="act prog" id="prog"></span></h3>
      <div class="paths" id="paths"></div>
    </div>

    <div class="card editor">
      <div class="tabs" id="tabs">
        <button data-t="spec" class="on">✏️ 이번 지시문 (고칠 수 있음)</button>
        <button data-t="base">📘 기준선 (읽기 전용)</button>
        <button data-t="notes">✍️ 추가 지시</button>
        <button data-t="diff">🔍 초안과 비교</button>
      </div>
      <textarea class="box" id="body" spellcheck="false"></textarea>
      <pre class="view" id="view" hidden></pre>
      <div class="bar2" style="margin-top:.7rem">
        <button class="btn primary" id="save">저장</button>
        <button class="btn" id="revert">되돌리기</button>
        <span class="muted" id="hint"></span>
      </div>
    </div>
  </section>
</div>

<script src="/assets/ui.js"></script>
<script>
let role = new URLSearchParams(location.search).get("role") || null;
let tab = "spec", base = "", specs = [];

nav('<span id="cyc" class="muted"></span> <a class="btn sm" href="/agent.html">🧑‍💻 에이전트</a>');
cycleBadge($("cyc"));

const FM = /^---\r?\n[\s\S]*?\r?\n---\r?\n?/;   // front-matter 는 HQ 가 관리한다

async function loadRoles() {
  const d = await api("/api/specs");
  specs = d.specs || [];
  $("prog").textContent = d.total ? `${d.customized} / ${d.total} 명이 고침` : "";
  $("roles").innerHTML = specs.map(s =>
    `<button data-r="${s.role}" class="${s.role === role ? "on" : ""}">
       <span>${esc(s.role)}</span>
       <span class="st ${s.status}">${s.status === "customized" ? "고침" : "초안"}</span>
     </button>`).join("")
    || `<div class="card"><div class="empty">아직 AGENT.md 가 없습니다.<br>
         S2 기획 단계에서 만들어집니다.</div></div>`;
  $("roles").querySelectorAll("button").forEach(b => b.onclick = () => {
    role = b.dataset.r; history.replaceState(null, "", `?role=${role}`);
    loadRoles(); load();
  });
  if (!role && specs.length) role = specs[0].role;
}

function paths(sp) {
  const rows = [
    ["기준선", `agents/${role}/AGENT.md`,
     "사람이 미리 써 둔 원본. git 이 추적하고 수업 중엔 안 바뀝니다.", null],
    ["이번 지시문", sp ? sp.path : `project-001/agents/${role}/AGENT.md`,
     "★ 여기를 고치면 카운터가 오릅니다.",
     `/files.html?path=${encodeURIComponent("project-001/agents/" + role)}`],
    ["추가 지시", `project-001/agents/${role}/NOTES.md`,
     "작업 도중 끼워 넣는 말. 다음 실행에 반영됩니다.", `/agent.html?role=${role}`],
  ];
  $("paths").innerHTML = rows.map(([k, p, why, link]) => `
    <b>${k}</b>
    <div class="row">
      <span class="pathbox" style="flex:1;min-width:14rem">${esc(p)}</span>
      <button class="btn sm" data-copy="${esc(p)}">복사</button>
      ${link ? `<a class="btn sm" href="${link}">열기</a>` : ""}
      <span class="muted">${esc(why)}</span>
    </div>`).join("");
  $("paths").querySelectorAll("[data-copy]").forEach(b => b.onclick = () => {
    navigator.clipboard?.writeText(b.dataset.copy);
    toast("경로를 복사했습니다", "ok", 2000);
  });
}

async function load() {
  if (!role) return;
  $("title").textContent = `${role} 의 AGENT.md`;
  paths(specs.find(s => s.role === role));
  await show(tab);
}

async function show(t) {
  tab = t;
  $("tabs").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  const ta = $("body"), pv = $("view");
  const editable = (t === "spec" || t === "notes");
  ta.hidden = !editable; pv.hidden = editable;
  $("save").disabled = !editable; $("revert").disabled = !editable;

  try {
    if (t === "spec") {
      base = String(await api(`/api/specs/${role}/raw`)).replace(FM, "");
      ta.value = base;
      $("hint").textContent = "저장하면 '고침' 이 되고, 11명이 다 채우면 사이클이 자동 재개됩니다.";
    } else if (t === "notes") {
      const n = await api(`/api/agents/${role}/notes`);
      base = n.text || ""; ta.value = base;
      $("hint").textContent = n.applies_when;
    } else if (t === "base") {
      pv.textContent = await api(`/api/specs/${role}/baseline`);
    } else {
      const d = String(await api(`/api/specs/${role}/diff`));
      pv.innerHTML = d.split("\n").map(l =>
        `<span class="${l.startsWith("+") ? "add" : l.startsWith("-") ? "del"
          : l.startsWith("@") ? "hd" : ""}">${esc(l)}</span>`).join("\n")
        || `<span class="muted">아직 고친 내용이 없습니다.</span>`;
    }
  } catch (e) {
    if (editable) { ta.value = ""; base = ""; }
    else pv.textContent = e.message;
    $("hint").textContent = "";
  }
}

$("tabs").querySelectorAll("button").forEach(b => b.onclick = () => show(b.dataset.t));
$("revert").onclick = () => { $("body").value = base; toast("되돌렸습니다", "ok", 2000); };

$("save").onclick = () => act($("save"), async () => {
  const v = $("body").value;
  if (tab === "spec") {
    if (!v.trim()) throw new Error("빈 내용은 저장할 수 없습니다");
    const r = await api(`/api/specs/${role}/raw`, {
      method: "PUT", headers: { "Content-Type": "text/plain" }, body: v });
    base = v; loadRoles();
    return { note: r.resumed ? "저장했습니다 — 11/11 완료, 사이클을 재개합니다!"
                             : `저장했습니다 (${r.customized}/${r.total})` };
  }
  await api(`/api/agents/${role}/notes`, {
    method: "PUT", headers: { "Content-Type": "text/plain" }, body: v });
  base = v;
  return { note: v.trim() ? "지시를 저장했습니다. 다음 실행부터 반영됩니다." : "지시를 비웠습니다" };
}).catch(() => {});

loadRoles().then(load);
</script>
</body>
</html>
