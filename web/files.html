<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파일 탐색기 — AGORA Web</title>
<link rel="stylesheet" href="/assets/office.css">
<style>
  .wrap{flex:1;display:flex;flex-direction:column;gap:.8rem;padding:1rem;min-height:0}
  .crumb{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap;
         background:var(--panel);border:1px solid var(--line);border-radius:10px;
         padding:.6rem .9rem;font-family:ui-monospace,monospace;font-size:.98rem}
  .crumb a{color:#a5d8ff;text-decoration:none;font-weight:650}
  .crumb a:hover{text-decoration:underline}
  .crumb .sep{color:var(--dim)}
  .crumb .act{margin-left:auto;display:flex;gap:.4rem;font-family:system-ui}

  .quick{display:flex;gap:.4rem;flex-wrap:wrap}
  .quick a{border:1.5px solid var(--line);border-radius:9px;padding:.38rem .8rem;
    font-size:.93rem;font-weight:650;text-decoration:none;color:var(--fg);background:#121824}
  .quick a:hover{background:#222c3c}

  .cols{flex:1;display:grid;grid-template-columns:minmax(20rem,26rem) 1fr;gap:1rem;min-height:0}
  @media (max-width:980px){ .cols{grid-template-columns:1fr} }
  .card{display:flex;flex-direction:column;min-height:0}

  .list{flex:1;overflow-y:auto}
  .list a{display:flex;gap:.55rem;align-items:center;padding:.45rem .5rem;
    border-bottom:1px solid #232b3a;color:var(--fg);text-decoration:none;font-size:.97rem}
  .list a:hover{background:#1c2432}
  .list a.on{background:#1b2740}
  .list .ic{width:1.4rem;text-align:center}
  .list .nm{flex:1;font-family:ui-monospace,monospace;font-size:.93rem;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .list .meta{color:var(--dim);font-size:.85rem;white-space:nowrap}
  .list .go{color:#86efac;font-size:.85rem}

  textarea{flex:1;min-height:24rem}
  .imgbox{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;
    background:#0f131b;border:1.5px solid var(--line);border-radius:9px}
  .imgbox img{max-width:100%}
  iframe.pv{flex:1;min-height:24rem;border:0;border-radius:9px;background:#fff}
  .fmeta{display:flex;gap:.8rem;flex-wrap:wrap;color:var(--dim);font-size:.9rem;margin-bottom:.5rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="quick" id="quick"></div>
  <div class="crumb" id="crumb"></div>

  <div class="cols">
    <div class="card">
      <h3>파일
        <span class="act">
          <input class="box" id="filter" placeholder="이름으로 걸러내기" style="width:11rem;padding:.3rem .55rem;font-size:.9rem">
          <button class="btn sm" id="mknew">+ 새 파일</button>
          <span class="muted" id="count"></span>
        </span></h3>
      <div class="list" id="list"></div>
    </div>

    <div class="card">
      <h3><span id="fname">파일을 고르세요</span>
        <span class="act">
          <button class="btn sm" id="tabEdit">✏️ 편집</button>
          <button class="btn sm" id="tabView">👁 미리보기</button>
          <button class="btn sm" id="dl">⬇ 내려받기</button>
          <button class="btn sm" id="reload">되돌리기</button>
          <button class="btn sm primary" id="save" disabled>저장</button>
        </span></h3>
      <div class="fmeta" id="fmeta"></div>
      <textarea class="box" id="body" spellcheck="false"
        placeholder="왼쪽에서 파일을 고르면 내용이 나옵니다"></textarea>
      <iframe class="pv" id="pv" hidden title="파일 미리보기"></iframe>
      <div class="imgbox" id="imgbox" hidden><img id="img" alt="이미지 미리보기"></div>
    </div>
  </div>
</div>

<script src="/assets/ui.js"></script>
<script>
let dir = new URLSearchParams(location.search).get("path") || "";
let cur = null, base = "", items = [], mode = "edit";

nav('<span id="cyc" class="muted"></span>');
cycleBadge($("cyc"));

const IMG = /\.(png|jpe?g|gif|webp|svg|ico)$/i;
const WEB = /\.(html?|css|js|json|svg|md|txt)$/i;

async function quick() {
  let cid = "";
  try { const d = await api("/api/dashboard"); if (d.cycle) cid = d.cycle.id; } catch {}
  $("quick").innerHTML = [
    ["repo/ 전체", ""],
    ["확정 산출물", "project-001"],
    ["AGENT.md 11개", "project-001/agents"],
    ...(cid ? [[`사이클 #${cid} 실행 결과`, `runs/${cid}`]] : []),
    ["보존본(showcase)", "showcase"],
  ].map(([ko, p]) => `<a href="?path=${encodeURIComponent(p)}">${ko}</a>`).join("");
}

async function ls() {
  let d;
  try { d = await api(`/api/files/tree?path=${encodeURIComponent(dir)}`); }
  catch (e) { $("list").innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  items = d.items || [];

  const parts = dir ? dir.split("/") : [];
  let acc = "";
  $("crumb").innerHTML =
    `<a href="?path=">repo</a>` + parts.map(p => {
      acc = acc ? `${acc}/${p}` : p;
      return `<span class="sep">/</span><a href="?path=${encodeURIComponent(acc)}">${esc(p)}</a>`;
    }).join("") +
    `<span class="act">
       <button class="btn sm" id="copydir">경로 복사</button>
       ${d.site_url ? `<a class="btn sm primary" target="_blank" rel="noopener" href="${esc(d.site_url)}">🌐 사이트 열기</a>` : ""}
     </span>`;
  $("copydir").onclick = () => {
    navigator.clipboard?.writeText(dir || "repo/");
    toast("경로를 복사했습니다", "ok", 2000);
  };
  paint();
}

function paint() {
  const q = $("filter").value.trim().toLowerCase();
  const show = items.filter(it => !q || it.name.toLowerCase().includes(q));
  const up = dir ? `<a href="?path=${encodeURIComponent(dir.split("/").slice(0, -1).join("/"))}">
      <span class="ic">↰</span><span class="nm">..</span></a>` : "";
  $("list").innerHTML = up + show.map(it => it.type === "dir"
    ? `<a href="?path=${encodeURIComponent(it.path)}">
         <span class="ic">📁</span><span class="nm">${esc(it.name)}</span>
         <span class="meta">${it.count}개</span></a>`
    : `<a href="#" data-p="${esc(it.path)}" class="${cur === it.path ? "on" : ""}">
         <span class="ic">${IMG.test(it.name) ? "🖼" : "📄"}</span>
         <span class="nm">${esc(it.name)}</span>
         <span class="meta">${sz(it.size)}</span>
         ${WEB.test(it.name) || IMG.test(it.name)
           ? `<span class="go" data-open="${esc(it.path)}">열기</span>` : ""}</a>`
  ).join("") || `<div class="empty">비어 있습니다.</div>`;
  $("count").textContent = `${show.length}${q ? ` / ${items.length}` : ""}개`;

  $("list").querySelectorAll("a[data-p]").forEach(a => a.onclick = (e) => {
    e.preventDefault();
    if (e.target.dataset.open) { window.open("/preview/" + e.target.dataset.open, "_blank"); return; }
    open_(a.dataset.p);
  });
}
$("filter").oninput = paint;

function setMode(m) {
  mode = m;
  const img = cur && IMG.test(cur);
  $("body").hidden = m !== "edit" || img;
  $("pv").hidden = !(m === "view" && !img);
  $("imgbox").hidden = !img;
  $("tabEdit").classList.toggle("primary", m === "edit");
  $("tabView").classList.toggle("primary", m === "view");
}

async function open_(p) {
  cur = p;
  $("fname").textContent = p;
  const it = items.find(x => x.path === p) || {};
  $("fmeta").innerHTML =
    `<span>${sz(it.size || 0)}</span>
     <span>${it.mtime ? new Date(it.mtime * 1000).toLocaleString("ko-KR") : ""}</span>
     <span class="pathbox">${esc(p)}</span>`;
  paint();

  if (IMG.test(p)) { $("img").src = "/preview/" + p; setMode("view"); $("save").disabled = true; return; }
  $("pv").src = "/preview/" + p + "?t=" + Date.now();
  try {
    base = await api(`/api/files?path=${encodeURIComponent(p)}`);
    $("body").value = base;
    $("save").disabled = false;
  } catch (e) {
    $("body").value = `(읽을 수 없습니다: ${e.message})`;
    $("save").disabled = true;
  }
  setMode("edit");
}

$("tabEdit").onclick = () => setMode("edit");
$("tabView").onclick = () => { if (cur) { $("pv").src = "/preview/" + cur + "?t=" + Date.now(); } setMode("view"); };
$("reload").onclick = () => { $("body").value = base; toast("되돌렸습니다", "ok", 2000); };

$("dl").onclick = () => {
  if (!cur) { toast("파일을 먼저 고르세요", "bad"); return; }
  const a = document.createElement("a");
  a.href = "/preview/" + cur; a.download = cur.split("/").pop(); a.click();
};

$("save").onclick = () => act($("save"), async () => {
  await api(`/api/files?path=${encodeURIComponent(cur)}`, {
    method: "PUT", headers: { "Content-Type": "text/plain" }, body: $("body").value });
  base = $("body").value;
  return { note: "저장했습니다" };
}).catch(() => {});

$("mknew").onclick = () => {
  const name = prompt(`새 파일 이름 (현재 폴더: ${dir || "repo/"})\n폴더를 만들려면 끝에 / 를 붙이세요`);
  if (!name) return;
  act($("mknew"), () => api("/api/files", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ path: (dir ? dir + "/" : "") + name, content: "" }),
  }), "만들었습니다").then(ls).catch(() => {});
};

quick(); ls();
</script>
</body>
</html>
