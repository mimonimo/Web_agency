<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에이전트 — AGORA Web</title>
<link rel="stylesheet" href="/assets/office.css">
<style>
  .wrap{flex:1;display:grid;grid-template-columns:minmax(14rem,17rem) 1fr;
        gap:1rem;padding:1rem;min-height:0}
  @media (max-width:1000px){
    .wrap{grid-template-columns:1fr}
    .roles{flex-direction:row;flex-wrap:wrap;max-height:none;overflow:visible}
    .roles button{flex:0 0 auto}
    .roles button br{display:none}
  }

  .roles{display:flex;flex-direction:column;gap:.35rem;
         max-height:calc(100vh - 7rem);overflow-y:auto}
  .roles button{
    flex:none;display:flex;align-items:center;gap:.55rem;text-align:left;
    background:var(--panel);border:1.5px solid var(--line);border-radius:10px;
    padding:.55rem .75rem;cursor:pointer;color:var(--fg);font:inherit;font-size:.99rem}
  .roles button:hover{background:var(--panel2);border-color:#48587a}
  .roles button.on{background:#1b2740;border-color:#33507f}
  .roles .dot{width:.65rem;height:.65rem;border-radius:50%;background:var(--idle);flex:none}
  .roles .dot.up{background:var(--ok)}
  .roles .n{margin-left:auto;background:var(--wait);color:#0d1017;font-weight:800;
    border-radius:999px;padding:0 .5rem;font-size:.8rem}

  .main{display:flex;flex-direction:column;gap:1rem;min-height:0;overflow-y:auto}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
  @media (max-width:1200px){ .grid2{grid-template-columns:1fr} }
  ul.tight{margin:.2rem 0 .8rem;padding-left:1.15rem;line-height:1.6}
  ul.tight li{margin:.12rem 0}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:.4rem .8rem;font-size:.95rem;align-items:center}
  .kv b{color:var(--dim);font-weight:650}
  .files a{display:flex;gap:.5rem;align-items:center;padding:.4rem .3rem;
    border-bottom:1px solid #232b3a;color:var(--fg);text-decoration:none;font-size:.95rem}
  .files a:hover{background:#1c2432}
  .files .nm{flex:1;font-family:ui-monospace,monospace;font-size:.9rem;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .noteline{display:flex;gap:.5rem;align-items:flex-start;padding:.4rem 0;
    border-bottom:1px solid #232b3a;font-size:.95rem}
  .noteline span.t{flex:1}
  .findings div{padding:.3rem 0;border-bottom:1px solid #232b3a;font-size:.94rem}
  .findings .fix{color:var(--dim);font-size:.9rem;padding-left:1.3rem;border:0}
  .steps table{width:100%;border-collapse:collapse;font-size:.95rem}
  .steps td{padding:.4rem .3rem;border-bottom:1px solid #232b3a}
  .msg{max-height:14rem;overflow-y:auto;font-size:.92rem}
  .msg div{padding:.3rem 0;border-bottom:1px solid #232b3a}
  pre.prompt{margin:0;white-space:pre-wrap;font-size:.88rem;line-height:1.6;
    max-height:30rem;overflow:auto;background:#0f131b;border:1px solid var(--line);
    border-radius:8px;padding:.75rem;font-family:ui-monospace,"D2Coding",monospace}
</style>
</head>
<body>
<div class="wrap">
  <aside class="roles" id="roles"></aside>
  <section class="main" id="main"><div class="card"><div class="empty">불러오는 중…</div></div></section>
</div>

<script src="/assets/ui.js"></script>
<script>
let list = [], role = new URLSearchParams(location.search).get("role") || "designer";
let D = null, C = null;

nav('<span id="cyc" class="muted"></span> <a class="btn sm" href="/review.html">👀 보고 고치기</a>');

async function loadRoles() {
  list = await api("/api/agents");
  $("roles").innerHTML = list.map(r =>
    `<button data-r="${r.role}" class="${r.role === role ? "on" : ""}">
       <span class="dot" id="dot-${r.role}"></span>
       <span>${esc(r.display_name)}<br>
         <span class="muted" style="font-size:.82rem">${esc(r.role)}</span></span>
       ${r.notes ? `<span class="n" title="사람이 넣은 지시 ${r.notes}건">${r.notes}</span>` : ""}
     </button>`).join("");
  $("roles").querySelectorAll("button").forEach(b => b.onclick = () => {
    role = b.dataset.r;
    history.replaceState(null, "", `?role=${role}`);
    loadRoles(); load();
  });
}

async function load() {
  [D, C] = await Promise.all([
    api(`/api/agents/${role}`),
    api(`/api/agents/${role}/catalog`).catch(() => ({})),
  ]);
  cycleBadge($("cyc"));
  render();
  const dot = $("dot-" + role); if (dot) dot.classList.toggle("up", D.node.status === "up");
}

const li = (xs) => (xs || []).map(x => `<li>${esc(x)}</li>`).join("");

function render() {
  const cur = D.current, notes = D.notes || { items: [], global_items: [] };
  $("main").innerHTML = `
  <div class="card">
    <h3>${esc(D.display_name)} <span class="muted">${esc(D.role)}</span>
      <span class="act">
        <span class="chip ${D.node.status === "up" ? "on" : ""}">${D.node.status === "up" ? "● 노드 살아 있음" : "○ 노드 응답 없음"}</span>
        <span class="muted">${esc(D.node.dgx_host || "")}</span>
      </span></h3>
    <p style="margin:.1rem 0 .8rem">${esc(C.mission || "")}</p>
    <div class="kv">
      <b>지금</b><span>${cur ? `<span class="badge RUNNING">${esc(cur.key)}</span> ${esc(cur.name)}`
                            : `<span class="muted">쉬는 중</span>`}</span>
      <b>담당 단계</b><span>${esc((C.steps || []).join(", ") || "-")}</span>
      <b>기준선</b><span class="pathbox">${esc(D.paths.baseline)}</span>
      <b>이번 지시문</b><span><span class="pathbox" style="display:inline-block">${esc(D.paths.spec)}</span>
        <a class="btn sm" href="/edit.html?role=${role}" style="margin-left:.4rem">📝 편집</a></span>
    </div>
  </div>

  <div class="card">
    <h3>✍️ 이 역할에게 지시 추가
      <span class="act"><button class="btn sm danger" id="clr">전부 지우기</button></span></h3>
    <p class="muted" style="margin:.1rem 0 .6rem">
      저장하면 <b>${esc(D.display_name)}</b> 가 <b>다음에 일할 때</b> 프롬프트 맨 뒤에 붙습니다
      (앞의 어떤 지침보다 우선). 지금 돌고 있는 단계에 넣으려면 아래 <b>↻재요청</b> 도 누르세요.<br>
      파일: <span class="pathbox" style="display:inline-block">${esc(notes.path)}</span>
    </p>
    <div style="display:flex;gap:.5rem">
      <input class="box" id="note" style="flex:1" autocomplete="off"
             placeholder="예) 버튼 모서리를 더 둥글게. 반경 12px 정도로.">
      <button class="btn primary" id="addnote">추가</button>
    </div>
    <div id="notes" style="margin-top:.6rem">
      ${(notes.items.length || notes.global_items.length) ? "" : `<div class="muted">아직 없습니다.</div>`}
      ${notes.global_items.map(t => `<div class="noteline"><span class="chip">전원</span><span class="t">${esc(t)}</span></div>`).join("")}
      ${notes.items.map(t => `<div class="noteline"><span class="chip on">${esc(D.display_name)}</span><span class="t">${esc(t)}</span></div>`).join("")}
    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <h3>🎯 목표와 완료 조건</h3>
      <b class="muted">이번에 달성할 것</b>
      <ul class="tight">${li(C.goals)}</ul>
      <b class="muted">완료 조건 — 게이트가 본다</b>
      <ul class="tight">${li(C.dod)}</ul>
      <b class="muted">특히 조심할 것</b>
      <ul class="tight">${li(C.forbid)}</ul>
    </div>

    <div class="card">
      <h3>✅ 산출물 검사
        <span class="act"><button class="btn sm primary" id="chk">지금 검사</button></span></h3>
      <p class="muted" style="margin:.1rem 0 .5rem">
        HQ 가 단계 직후에 자동으로 돌리는 것과 같은 기계 검사입니다.
        산출물을 손으로 고친 뒤 다시 눌러 확인하세요.</p>
      <div class="findings" id="findings"><div class="muted">「지금 검사」를 누르세요.</div></div>
    </div>
  </div>

  <div class="grid2">
    <div class="card steps">
      <h3>📋 맡은 단계
        <span class="act">
          <button class="btn sm" id="pause">⏸ 일시정지</button>
          <button class="btn sm primary" id="retry">↻ 재요청</button>
        </span></h3>
      <table><tbody>${(D.steps || []).map(s => `
        <tr>
          <td><b>${esc(s.key)}</b></td>
          <td>${esc(s.name)}</td>
          <td><span class="badge ${s.status}" style="font-size:.78rem;padding:.1rem .55rem">${s.status}</span></td>
          <td style="text-align:right"><button class="btn sm" data-step="${esc(s.key)}" title="이 단계만 다시">↻</button></td>
        </tr>`).join("") || `<tr><td class="muted">없습니다</td></tr>`}</tbody></table>
      <p class="muted" style="margin-top:.5rem">
        재요청은 <b>그 단계 하나만</b> 다시 돌립니다 (되감기와 다름).
        사이클이 돌고 있으면 먼저 일시정지하세요.</p>
    </div>

    <div class="card">
      <h3>📄 만든 파일 <span class="act muted">${(D.artifacts || []).length}개</span></h3>
      <div class="files">${(D.artifacts || []).slice(0, 40).map(a =>
        `<a href="/files.html?path=${encodeURIComponent(a.path.split("/").slice(0, -1).join("/"))}"
            title="${esc(a.path)}"><span>📄</span>
           <span class="nm">${esc(a.path)}</span>
           <span class="muted">${esc(a.step || "")}</span></a>`).join("")
        || `<div class="muted">아직 없습니다</div>`}</div>
    </div>
  </div>

  <div class="card">
    <h3>📜 이 에이전트가 받은 지시문
      <span class="act">
        <span class="muted" id="pmeta"></span>
        <button class="btn sm" id="pshow">보기</button>
      </span></h3>
    <p class="muted" style="margin:.1rem 0 .5rem">
      "무슨 일을 시켰길래 저런 결과가 나왔나" 를 눈으로 봐야
      지시문을 고칠 마음이 생깁니다. 기준선 + 품질기준 + 목표·완료조건 +
      <b>사람이 추가한 지시</b>가 합쳐진 최종 본문입니다.</p>
    <pre class="prompt" id="prompt" hidden></pre>
  </div>

  <div class="card">
    <h3>💬 주고받은 말</h3>
    <div class="msg">${(D.messages || []).slice().reverse().map(m =>
      `<div><span class="muted">${esc(m.from)}→${esc(m.to)}</span> ${esc(m.summary || "")}</div>`).join("")
      || `<div class="muted">아직 없습니다</div>`}</div>
  </div>`;
  wire();
}

function wire() {
  const add = async () => {
    const t = $("note").value.trim();
    if (!t) { toast("지시를 한 줄 적어 주세요", "bad"); return; }
    await act($("addnote"), () => api(`/api/agents/${role}/notes`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: t }),
    }), "지시를 넣었습니다. 다음 실행부터 반영됩니다.");
    $("note").value = ""; load(); loadRoles();
  };
  $("addnote").onclick = add;
  $("note").onkeydown = (e) => { if (e.key === "Enter") add(); };

  $("clr").onclick = () => act($("clr"),
    () => api(`/api/agents/${role}/notes`, { method: "DELETE" }), "지시를 비웠습니다")
    .then(() => { load(); loadRoles(); }).catch(() => {});

  $("chk").onclick = () => act($("chk"), async () => {
    const r = await api(`/api/agents/${role}/check`);
    const box = $("findings");
    if (!r.results.length) {
      box.innerHTML = `<div class="muted">검사할 산출물이 아직 없습니다.</div>`;
      return { note: "산출물이 아직 없습니다" };
    }
    box.innerHTML = r.results.map(res => `
      <div><b>${esc(res.dir)}</b> —
        <b class="${res.ok === res.total ? "ok-mark" : "bad-mark"}">${res.ok}/${res.total}</b></div>
      ${res.findings.map(f => `
        <div>${f.ok ? "✅" : "❌"} ${esc(f.label)}${(!f.ok && f.detail) ? " — " + esc(f.detail) : ""}</div>
        ${(!f.ok && f.fix) ? `<div class="fix">→ ${esc(f.fix)}</div>` : ""}`).join("")}`).join("");
    const tot = r.results.reduce((a, x) => a + x.total, 0);
    const ok = r.results.reduce((a, x) => a + x.ok, 0);
    return { note: `완료 조건 ${ok}/${tot} 통과` };
  }).catch(() => {});

  $("pause").onclick = () => act($("pause"), async () => {
    const d = await api("/api/dashboard");
    if (!d.cycle) throw new Error("사이클이 없습니다");
    return api(`/api/cycles/${d.cycle.id}/pause`, { method: "POST" });
  }, "일시정지 요청 — 현재 단계를 마치고 멈춥니다").then(load).catch(() => {});

  $("pshow").onclick = () => act($("pshow"), async () => {
    const box = $("prompt");
    if (!box.hidden) { box.hidden = true; return { note: "닫았습니다" }; }
    const d = await api(`/api/activity/prompt?role=${role}`);
    $("pmeta").innerHTML = d.step
      ? `${esc(d.step)} ${esc(d.step_name || "")} · 참고자료 ${(d.inputs || []).length}건 · 산출 ${(d.outputs || []).join(", ") || "-"}`
      : esc(d.note || "");
    box.textContent = (d.order ? `[주문서]\n${d.order}\n\n${"─".repeat(40)}\n\n` : "")
                    + (d.instruction || "(지시문 없음)");
    box.hidden = false;
    return { note: `${(d.instruction || "").length}자` };
  }).catch(() => {});

  const retry = (step, btn) => act(btn, () =>
    api(`/api/agents/${role}/retry${step ? "?step_key=" + encodeURIComponent(step) : ""}`,
        { method: "POST" })).then(load).catch(() => {});
  $("retry").onclick = () => retry(null, $("retry"));
  $("main").querySelectorAll("button[data-step]").forEach(b =>
    b.onclick = () => retry(b.dataset.step, b));
}

loadRoles().then(load);
setInterval(() => { if (!document.querySelector("[data-busy]")) load(); }, 12000);
</script>
</body>
</html>
