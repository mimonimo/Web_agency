# Alembic 설정 (BRIEF §13 Phase 1 — 모델·마이그레이션)
#
# 접속 문자열은 여기 적지 않는다. alembic/env.py 가 환경변수 DATABASE_URL 을 읽는다.
# (비밀을 커밋하지 않기 위해서 — BRIEF §15-6)

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
