# 신규 개발 파이프라인 (BRIEF §3.6)
#
# ★ 파이프라인은 코드가 아니라 데이터다. 코드에 단계를 하드코딩하지 마라.
#   강사가 수업 중에 단계를 자를 수 있어야 한다.
#
# `inputs` 는 그 단계의 에이전트가 **읽어야 할 참고 자료**다.
# HQ 가 앞 단계 산출물에서 이름으로 찾아 노드에 실어 보낸다 (runner.resolve_inputs).
# 여기 안 적으면 에이전트는 아무것도 못 보고 지어낸다. 실제로 그랬다.

name: web_delivery
kind: new

steps:
  - id: S1
    name: 접수·범위 합의
    role: sales
    task: intake
    inputs:  [order]
    outputs: [SOW.md, QUOTE.md]
    timeout_sec: 600

  - id: S2
    name: 요구사항 해석 + AGENT.md 초안 생성
    role: planner
    task: draft_specs
    inputs:  [order, SOW.md]
    outputs: [SRS.md, SCREENS.md, "agents/*/AGENT.md"]
    emits_specs: true          # ★ 이 단계가 11개 AGENT.md 초안을 만든다
    # 11개를 3개씩 묶어 만든다. 본 작업 + 배치 4회 + 보충을 감안한 시간이다.
    timeout_sec: 2400

  - id: S3
    name: 커스터마이징 게이트
    type: human_gate           # ★ 여기서 자동으로 멈춘다
    wait_for: all_specs_customized
    allow_override: true       # 강사가 강제 통과 가능
    hint: "학생들이 AGENT.md 를 고쳐 커밋하면 자동 재개된다"

  - id: S4
    name: 설계
    parallel: [designer, dba, backend, sysadmin]
    task: design
    inputs:  [order, SRS.md, SCREENS.md, SOW.md]
    outputs: [design-tokens.json, schema.sql, api-contract.yaml, ops/run.sh]
    # 역할마다 만들 것이 다르다. 넷이 같은 파일을 네 벌 만들면 안 된다.
    role_outputs:
      designer: [design-tokens.json, UI-GUIDE.md]
      dba:      [schema.sql]
      backend:  [api-contract.yaml]
      sysadmin: [ops/run.sh, DEPLOY.md]
    timeout_sec: 1200

  - id: S5
    name: 구현
    parallel: [frontend, backend, dba]
    task: implement
    inputs:  [order, SRS.md, SCREENS.md, design-tokens.json, api-contract.yaml, schema.sql]
    role_outputs:
      frontend: [index.html, style.css, app.js]
      backend:  [server.js, README.md]
      dba:      [seed.sql]
    timeout_sec: 1800

  - id: S6
    name: QA 게이트
    role: qa
    type: gate
    # 게이트는 심사할 파일을 전부 받아야 한다.
    # 못 받으면 "확인할 수 없다" 며 반려한다 — 실제로 그랬다.
    inputs:  [SRS.md, SCREENS.md, index.html, style.css, app.js,
              design-tokens.json, api-contract.yaml, server.js]
    outputs: [VERDICT.md]
    on_reject: { rewind_to: S5 }

  - id: S7
    name: 보안 게이트
    role: security
    type: gate
    inputs:  [SRS.md, index.html, style.css, app.js, server.js,
              schema.sql, api-contract.yaml]
    outputs: [VERDICT.md]
    on_reject: { rewind_to: S5, priority: critical }

  - id: S8
    name: 고객 검수(UAT)
    role: customer
    type: gate
    inputs:  [order, SOW.md, SRS.md, SCREENS.md, index.html, style.css]
    outputs: [VERDICT.md]
    on_reject: { rewind_to: S2 }    # ★ 기획으로 돌아간다

  - id: S9
    name: 배포
    role: sysadmin
    task: deploy
    inputs:  [index.html, style.css, app.js, server.js, ops/run.sh]
    outputs: [DEPLOY-LOG.md]

  - id: S10
    name: 운영 관찰
    role: customer
    task: generate_feedback         # 문의·클레임을 만들어 새 Order 발행
    inputs:  [order, index.html, style.css]
    outputs: [FEEDBACK.md]
    creates_orders: true
