# 결함 파이프라인 (BRIEF §3.6 표)
#   S1(접수만) → S6 QA 재현 → S5 수정 → S6 확인
#
# ⚠️ 미해결 이슈 — CLAUDE.md 참조
#   BRIEF §3.6 본문은 "셋 다 S1 영업에서 시작하는 것은 동일하다" 라고 하는데,
#   인수 항목 #24 는 "pipeline.defect.yaml 로 Cycle 생성 → S6(QA)부터 시작하는지 확인"
#   이라고 한다. 둘이 어긋난다.
#   여기서는 본문을 따라 S1 을 접수 전용으로 남겨 두었다. Phase 3c 에서 PM 확인 필요.

name: web_defect
kind: defect

steps:
  - id: S1
    name: 결함 접수
    role: sales
    task: intake_only          # 범위·비용 협의 없음. 티켓만 끊는다
    inputs:  [order]
    outputs: [DEFECT.md]
    timeout_sec: 300

  - id: S6
    name: QA 재현
    role: qa
    task: reproduce            # 게이트가 아니라 '재현' 작업이다
    inputs:  [DEFECT.md]
    outputs: [REPRO.md]
    timeout_sec: 900

  - id: S5
    name: 수정
    parallel: [frontend, backend, dba]
    task: fix
    inputs:  [REPRO.md]
    timeout_sec: 1800

  - id: S6R
    name: QA 확인
    role: qa
    type: gate
    on_reject: { rewind_to: S5 }
